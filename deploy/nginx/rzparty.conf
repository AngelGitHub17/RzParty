# NGINX : RzParty sur https://rzparty.fr
# 1. Copie ce fichier dans /etc/nginx/sites-available/rzparty.conf (ou conf.d/), puis :
#      ln -s /etc/nginx/sites-available/rzparty.conf /etc/nginx/sites-enabled/
# 2. Remplace 192.168.1.50 par l'IP du conteneur RzParty.
# 3. Certificat : certbot --nginx -d rzparty.fr -d www.rzparty.fr
#    (certbot ajoute lui-même les lignes ssl_certificate ; sans certbot, adapte les chemins ci-dessous).
# 4. nginx -t && systemctl reload nginx

upstream rzparty {
    server 192.168.1.50:5555;
    keepalive 16;
}

# Nécessaire pour les WebSockets (Socket.IO) : passe en « upgrade » seulement quand le navigateur le demande.
map $http_upgrade $rzparty_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name rzparty.fr www.rzparty.fr;

    # Laisse passer la validation Let's Encrypt, puis envoie tout le monde en HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rzparty.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rzparty.fr www.rzparty.fr;

    ssl_certificate     /etc/letsencrypt/live/rzparty.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rzparty.fr/privkey.pem;

    if ($host = www.rzparty.fr) { return 301 https://rzparty.fr$request_uri; }

    client_max_body_size 1m;

    location / {
        proxy_pass http://rzparty;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rzparty_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # RzParty lit la dernière adresse de cette liste (RZ_TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les parties durent : on ne coupe pas une connexion WebSocket silencieuse trop tôt.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
